services:
  postgres:
    image: postgres:17.2-alpine
    container_name: lumont-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumont
      POSTGRES_PASSWORD: lumontpasswd
      POSTGRES_DB: lumont_shop
    ports:
      - "5430:5432"
    volumes:
      - lumont_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lumont -d lumont_shop" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lumont_postgres_data: